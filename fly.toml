# Fly.io deployment config. Deploy with: fly deploy --ha=false
# SQLite lives inside the container, so run a single machine; data resets on each restart.
app = "prelegal"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  COOKIE_SECURE = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
